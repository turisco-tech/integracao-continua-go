name: "Construção do artefato e Imagem Docker"

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar QEMU (Suporte a múltiplas arquiteturas)
        uses: docker/setup-qemu-action@v3

      - name: Configurar Docker Buildx (Motor avançado de build)
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir a imagem e enviar para o Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ci-cd-go:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ci-cd-go:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max